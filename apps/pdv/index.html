<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="application-name" content="Gtech Pay" />
    <style>
      html, body, #root {
        background-color: #0f172a;
        margin: 0;
      }
      #boot-fallback {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        color: #94a3b8;
        font-family: system-ui, sans-serif;
        z-index: 9999;
      }
      #boot-fallback img {
        width: clamp(7rem, 22vw, 11rem);
        height: clamp(7rem, 22vw, 11rem);
        object-fit: contain;
        object-position: center;
      }
    </style>
    <link rel="icon" type="image/png" href="/gtech-pay-icon-square.png" />
    <link rel="apple-touch-icon" href="/gtech-pay-icon-square.png" />
    <title>Gtech Pay — PDV</title>
  </head>
  <body class="h-screen overflow-hidden">
    <div id="boot-fallback" aria-live="polite">
      <img src="/gtech-pay-icon-square.png" alt="" width="512" height="512" decoding="async" />
      <p style="margin: 1.25rem 0 0; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase; color: #818cf8;">Gtech Pay</p>
    </div>
    <div id="root" class="h-full"></div>
    <div id="thermal-receipt-print-area"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
