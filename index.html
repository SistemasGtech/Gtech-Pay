  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'gtech-pdv-sync';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
      apiKey: "demo-key",
      authDomain: "demo.firebaseapp.com",
      projectId: "demo-project",
      storageBucket: "demo.appspot.com",
      messagingSenderId: "123456",
      appId: "1:123456:web:123456"
    };

    let db, auth;
    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      auth = getAuth(app);
    } catch (e) {
      console.warn("Nuvem em modo local/fallback:", e);
    }

    window.SyncService = {
      appId,
      db,
      auth,
      initAuth: async (onUserReady) => {
        try {
          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            const res = await signInWithCustomToken(auth, __initial_auth_token);
            onUserReady(res.user);
          } else {
            const res = await signInAnonymously(auth);
            onUserReady(res.user);
          }
        } catch (e) {
          console.warn("Auth fallback:", e);
          onUserReady(null);
        }
      },
      subscribe: (colName, callback, errorCb) => {
        if (!db) return () => {};
        const colRef = collection(db, 'artifacts', appId, 'public', 'data', colName);
        return onSnapshot(colRef, (snapshot) => {
          const list = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          callback(list);
        }, (err) => {
          console.error(`Erro na sincronização de ${colName}:`, err);
          if (errorCb) errorCb(err);
        });
      },
      saveDoc: async (colName, docId, data) => {
        if (!db) return;
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', colName, String(docId));
        return await setDoc(docRef, data, { merge: true });
      },
      deleteDoc: async (colName, docId) => {
        if (!db) return;
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', colName, String(docId));
        return await deleteDoc(docRef);
      }
    };
  </script>

      const [buscaRecibo, setBuscaRecibo] = useState('');
      const [categoriaSelecionada, setCategoriaSelecionada] = useState('todas');
      const [termoBusca, setTermoBusca] = useState('');
      const [modoExibicao, setModoExibicao] = useState('lista');
      
      const [carrinho, setCarrinho] = useState([]);
      const [clienteNome, setClienteNome] = useState('');

      const [opcoesSelecionadasModal, setOpcoesSelecionadasModal] = useState([]);
      const [erroObrigatorioModal, setErroObrigatorioModal] = useState(null);

      const [abaViaModal, setAbaViaModal] = useState('producao');

      // --- ESCUTA A NUVEM EM TEMPO REAL ---
      useEffect(() => {
        if (window.SyncService) {
          window.SyncService.initAuth(() => {
            setSincronizado(true);

            window.SyncService.subscribe('categorias', (data) => {
              if (data && data.length > 0) setCategorias(data);
              else CATEGORIAS_PADRAO.forEach(c => window.SyncService.saveDoc('categorias', c.id, c));
            });

            window.SyncService.subscribe('complementos', (data) => {
              if (data && data.length > 0) setComplementos(data);
              else COMPLEMENTOS_PADRAO.forEach(c => window.SyncService.saveDoc('complementos', c.id, c));

            window.SyncService.subscribe('produtos', (data) => {
              if (data && data.length > 0) setProdutos(data);
              else PRODUTOS_PADRAO.forEach(p => window.SyncService.saveDoc('produtos', p.id, p));
            });

            window.SyncService.subscribe('operadores', (data) => {
              if (data && data.length > 0) setOperadores(data);
              else OPERADORES_PADRAO.forEach(o => window.SyncService.saveDoc('operadores', o.id, o));
            });

            window.SyncService.subscribe('vendas', (data) => {
              if (data) {
                const ordenadas = [...data].sort((a, b) => (b.timestamp || b.id) - (a.timestamp || a.id));
                setHistoricoVendas(ordenadas);
              }
            });

            window.SyncService.subscribe('lojaInfo', (data) => {

        setErroLogin('');

          const novoPin = pinInput + num;
          setPinInput(novoPin);
          if (novoPin.length === 4 && operadorSelecionado) {
            if (operadorSelecionado.pin === novoPin) {
              setUsuarioLogado(operadorSelecionado);
              setOperadorSelecionado(null);
              setPinInput('');
              mostrarToast(`👋 Bem-vindo(a), ${operadorSelecionado.nome}!`);

              setErroLogin('PIN incorreto! Tente novamente.');
              setPinInput('');

      const handleApagarPin = () => {
        setPinInput(prev => prev.slice(0, -1));

        if (formaPagamento !== 'Dinheiro') return 0;

            const opc = comp.opcoes?.find(o => String(o.id) === String(opcId));

        setItemModal(prod);

        setObservacaoModal('');
        setErroObrigatorioModal(null);
        const opcsIniciais = [];
        const comps = complementos.filter(c => (prod.complementoIds || []).includes(String(c.id)));
        comps.forEach(comp => {
          if (comp.obrigatorio && comp.opcoes && comp.opcoes.length > 0) {
            opcsIniciais.push(comp.opcoes[0].id);
          }
        });
        setOpcoesSelecionadasModal(opcsIniciais);
      };

      const handleToggleOpcaoModal = (obrigatorio, grupoId, opcaoId) => {
        setErroObrigatorioModal(null);
        const grupo = complementos.find(g => String(g.id) === String(grupoId));
        if (!grupo) return;

        if (obrigatorio) {
          const idsDoGrupo = grupo.opcoes.map(o => String(o.id));
          const semOutrasDoGrupo = opcoesSelecionadasModal.filter(id => !idsDoGrupo.includes(String(id)));
          setOpcoesSelecionadasModal([...semOutrasDoGrupo, opcaoId]);
        } else {
          if (opcoesSelecionadasModal.includes(opcaoId)) {
            setOpcoesSelecionadasModal(opcoesSelecionadasModal.filter(id => String(id) !== String(opcaoId)));
          } else {
            setOpcoesSelecionadasModal([...opcoesSelecionadasModal, opcaoId]);
          }
        }
      };

      const handleAdicionarAoCarrinho = () => {
        if (!itemModal) return;

        for (const comp of complementosDoItemModal) {
          if (comp.obrigatorio) {
            const temOpcaoDoGrupo = comp.opcoes.some(opc => opcoesSelecionadasModal.map(String).includes(String(opc.id)));
            if (!temOpcaoDoGrupo) {
              setErroObrigatorioModal(`Por favor, selecione uma opção em "${comp.nome}".`);

        const opcoesDetalhadas = [];
        opcoesSelecionadasModal.forEach(opcId => {
          complementosDoItemModal.forEach(comp => {

              opcoesDetalhadas.push({ id: opc.id, nome: opc.nome, preco: Number(opc.preco || 0) });

          carrinhoItemId: Date.now() + Math.random(),
          produtoId: itemModal.id,
          nome: itemModal.nome,
          precoBase: itemModal.preco,
          precoUnitario: precoUnitarioCalculadoModal,
          quantidade: qtdModal,
          subtotal: precoUnitarioCalculadoModal * qtdModal,
          opcoes: opcoesDetalhadas,
          observacao: observacaoModal.trim()
        };

        setItemModal(null);
        mostrarToast(`🛒 ${qtdModal}x "${itemModal.nome}" adicionado!`);

      const handleRemoverDoCarrinho = (carrinhoItemId) => {
        setCarrinho(prev => prev.filter(i => i.carrinhoItemId !== carrinhoItemId));
      };

      const handleAlterarQtdCarrinho = (carrinhoItemId, delta) => {
        setCarrinho(prev => prev.map(item => {
          if (item.carrinhoItemId === carrinhoItemId) {
            const novaQtd = Math.max(1, item.quantidade + delta);
            return {
              ...item,
              quantidade: novaQtd,
              subtotal: item.precoUnitario * novaQtd
            };
          }
          return item;
        }));
      };

      // --- IMPRESSÃO TÉRMICA TIPO 2 VIAS ---
      const executarImpressaoDireta = (venda) => {

            <div style="font-size: 11px;">Data: ${venda.data} - ${venda.hora}</div>
            
            <div style="margin: 8px 0; padding: 8px; border: 3px solid #000; border-radius: 8px; background: #fff;">

                              <div className="w-10 h-10 rounded-xl font-black text-xs text-white flex items-center justify-center shadow-md" style={{ backgroundColor: op.cor || '#6366f1' }}>
                                {op.iniciais || 'OP'}
                              </div>
                              <div className="text-left">
                                <span className="font-extrabold text-sm text-white block leading-tight">{op.nome}</span>
                                <span className="text-[11px] text-slate-400 font-medium block">{op.cargo}</span>
                              </div>

                          </button>

                  <div>
                    <label className="block text-xs font-bold text-slate-400 uppercase mb-1">Senha</label>
                    <input type="password" placeholder="••••••••" value={senhaInput} onChange={(e) => setSenhaInput(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs font-semibold text-white" required />

                            <button type="button" key={opc.id} onClick={() => handleToggleOpcaoModal(grupo.obrigatorio, grupo.id, opc.id)} className={`w-full flex items-center justify-between p-3 rounded-2xl border text-xs font-semibold transition-all ${selecionada ? 'border-indigo-500 bg-indigo-600 text-white shadow-md' : 'border-slate-800 bg-slate-900 text-slate-300 hover:bg-slate-800'}`}>
                              <div className="flex items-center gap-3">
                                <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[11px] font-black ${selecionada ? 'bg-white text-indigo-600' : 'bg-slate-800 text-transparent'}`}>✓</span>
                                <span>{opc.nome}</span>
                              </div>
                              <span className="font-mono font-bold">{opc.preco > 0 ? `+ R$ ${Number(opc.preco).toFixed(2)}` : 'Grátis'}</span>
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  ))}

                  <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-2">
                    <label className="block text-xs font-extrabold uppercase text-slate-300">Observações para o Preparo</label>
                    <textarea rows="2" placeholder="Ex: Caprichar no recheio, sem canela..." value={observacaoModal} onChange={(e) => setObservacaoModal(e.target.value)} className="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-2.5 text-xs font-medium resize-none" />
                  </div>
                </div>

                <div className="pt-3 border-t border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-3 shrink-0">
                  <div className="flex items-center gap-3 w-full sm:w-auto">
                    <span className="text-xs font-bold text-slate-400 uppercase">Qtd:</span>
                    <div className="flex items-center gap-1 bg-slate-950 p-1 rounded-2xl border border-slate-800">
                      <button type="button" onClick={() => setQtdModal(prev => Math.max(1, prev - 1))} className="w-8 h-8 rounded-xl bg-slate-800 text-white font-black text-sm">-</button>
                      <span className="w-8 text-center font-mono font-black text-sm text-white">{qtdModal}</span>
                      <button type="button" onClick={() => setQtdModal(prev => prev + 1)} className="w-8 h-8 rounded-xl bg-slate-800 text-white font-black text-sm">+</button>
                    </div>
                  </div>

                  <button type="button" onClick={handleAdicionarAoCarrinho} className="w-full sm:w-auto flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-black py-3 px-5 rounded-2xl text-xs uppercase shadow-lg flex items-center justify-between">
                    <span>Incluir no Pedido</span>
                    <span className="font-mono bg-indigo-700 px-2.5 py-1 rounded-xl text-xs">R$ {(precoUnitarioCalculadoModal * qtdModal).toFixed(2)}</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL COMANDA CONCLUÍDA E IMPRESSÃO 2 VIAS */}
          {comandaConcluidaModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-xs z-50 flex items-center justify-center p-3 sm:p-4">
              <div className="bg-slate-900 text-white rounded-3xl max-w-sm w-full p-5 sm:p-6 shadow-2xl border border-slate-800 flex flex-col space-y-3 max-h-[92vh] overflow-y-auto custom-scroll">
                <div className="text-center space-y-1 shrink-0">
                  <div className="w-12 h-12 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto"><IconCheck /></div>
                  <h3 className="text-base font-black text-white">Venda Finalizada!</h3>
                </div>

                <div className="flex bg-slate-950 p-1 rounded-xl text-xs font-bold shrink-0 border border-slate-800">
                  <button onClick={() => setAbaViaModal('producao')} className={`flex-1 py-1.5 rounded-lg ${abaViaModal === 'producao' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>👨‍🍳 1ª Via (Produção)</button>
                  <button onClick={() => setAbaViaModal('cliente')} className={`flex-1 py-1.5 rounded-lg ${abaViaModal === 'cliente' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>🎫 2ª Via (Cliente)</button>
                </div>

                {abaViaModal === 'producao' ? (
                  <div className="bg-amber-950/40 border-2 border-dashed border-amber-500/40 p-3.5 rounded-2xl font-mono text-xs space-y-2 text-amber-100 shrink-0">
                    <div className="text-center border-b border-dashed border-amber-500/40 pb-2">
                      <span className="bg-amber-400 text-slate-950 text-[10px] font-black px-2 py-0.5 rounded uppercase block mb-1">*** 1ª VIA: PRODUÇÃO / COZINHA ***</span>
                      <p className="font-extrabold text-xs uppercase">{lojaInfo.nome}</p>
                      <div className="my-2 p-2 bg-amber-400 text-slate-950 rounded-xl">
                        <p className="text-[10px] font-black uppercase">SENHA DE ATENDIMENTO</p>
                        <p className="font-black text-3xl tracking-widest leading-tight">#{comandaConcluidaModal.senha}</p>
                      </div>
                      <p className="text-[11px] font-extrabold truncate">Cliente: {comandaConcluidaModal.cliente}</p>
                    </div>

                    <div className="space-y-2 py-1 max-h-36 overflow-y-auto custom-scroll">
                      {comandaConcluidaModal.itens.map((it, idx) => (
                        <div key={idx} className="border-b border-amber-500/20 pb-1.5">
                          <div className="font-black text-xs text-amber-200">{it.quantidade}x {it.nome}</div>
                          {it.opcoes && it.opcoes.map((o, oi) => <span key={oi} className="block text-[10px] font-bold text-amber-300 pl-2">• {o.nome}</span>)}
                          {it.observacao && <div className="text-[10px] font-black bg-slate-900 text-white p-1 rounded mt-1 border border-amber-500/30">OBS: {it.observacao}</div>}
                        </div>
                      ))}
                    </div>
                  </div>
                ) : (
                  <div className="bg-emerald-950/40 border-2 border-dashed border-emerald-500/40 p-3.5 rounded-2xl font-mono text-xs space-y-2 text-emerald-100 shrink-0">
                    <div className="text-center border-b border-dashed border-emerald-500/40 pb-2">
                      <span className="bg-emerald-500 text-slate-950 text-[10px] font-black px-2 py-0.5 rounded uppercase block mb-1">*** 2ª VIA: CLIENTE / SENHA ***</span>
                      <p className="font-extrabold text-xs uppercase">{lojaInfo.nome}</p>
                      <div className="my-2 p-2.5 bg-emerald-500 text-slate-950 rounded-xl">
                        <p className="text-[10px] font-black uppercase">SUA SENHA DE ATENDIMENTO</p>
                        <p className="font-black text-4xl tracking-widest leading-tight">#{comandaConcluidaModal.senha}</p>
                      </div>
                      <p className="text-[11px] font-extrabold truncate">Cliente: {comandaConcluidaModal.cliente}</p>
                    </div>

                    <div className="space-y-1 text-emerald-200">
                      <div className="flex justify-between font-black text-sm text-white"><span>TOTAL PAGO:</span><span>R$ {(comandaConcluidaModal.total || 0).toFixed(2)}</span></div>
                      <div className="flex justify-between text-[11px]"><span>Forma Pagto:</span><span className="font-bold">{comandaConcluidaModal.pagamento}</span></div>
                    </div>
                  </div>
                )}

                <div className="flex flex-col gap-2 pt-1 shrink-0">
                  <div className="flex gap-2">
                    <button onClick={() => executarImpressaoDireta(comandaConcluidaModal)} className="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-black py-2.5 rounded-2xl text-xs flex items-center justify-center gap-1.5"><IconPrinter /><span>Imprimir 2 Vias</span></button>
                    <button onClick={() => setComandaConcluidaModal(null)} className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-black py-2.5 rounded-2xl text-xs">Nova Venda</button>
                  </div>
                  <button onClick={() => handleCancelarVenda(comandaConcluidaModal.id)} className="w-full bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 font-bold py-2 rounded-2xl text-xs flex items-center justify-center gap-1.5"><IconTrash /><span>Cancelar Venda</span></button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
