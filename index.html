  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Inicialização da Nuvem para Sincronização
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'gtech-pdv-sync';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
      apiKey: "demo-key",
      authDomain: "demo.firebaseapp.com",
      projectId: "demo-project",
      storageBucket: "demo.appspot.com",
      messagingSenderId: "123456",
      appId: "1:123456:web:123456"
    };

    let db, auth;
    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      auth = getAuth(app);
    } catch (e) {
      console.warn("Nuvem em modo local/fallback:", e);
    }

    // Exposição da API de Sincronização Global para o React
    window.SyncService = {
      appId,
      db,
      auth,
      initAuth: async (onUserReady) => {
        try {
          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            const res = await signInWithCustomToken(auth, __initial_auth_token);
            onUserReady(res.user);
          } else {
            const res = await signInAnonymously(auth);
            onUserReady(res.user);
          }
        } catch (e) {
          console.warn("Auth fallback:", e);
          onUserReady(null);
        }
      },
      subscribe: (colName, callback, errorCb) => {
        if (!db) return () => {};
        const colRef = collection(db, 'artifacts', appId, 'public', 'data', colName);
        return onSnapshot(colRef, (snapshot) => {
          const list = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          callback(list);
        }, (err) => {
          console.error(`Erro na sincronização de ${colName}:`, err);
          if (errorCb) errorCb(err);
        });
      },
      saveDoc: async (colName, docId, data) => {
        if (!db) return;
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', colName, String(docId));
        return await setDoc(docRef, data, { merge: true });
      },
      addDoc: async (colName, data) => {
        if (!db) return;
        const colRef = collection(db, 'artifacts', appId, 'public', 'data', colName);
        return await addDoc(colRef, data);
      },
      deleteDoc: async (colName, docId) => {
        if (!db) return;
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', colName, String(docId));
        return await deleteDoc(docRef);
      }
    };
  </script>

        setOperadorSelecionado(null);
        setPinInput('');
        mostrarToast('🔒 Sessão encerrada.', 'alerta');
      };

      // --- CÁLCULOS DO PDV E FILTROS ---
      const produtosFiltrados = useMemo(() => {
        return produtos.filter(prod => {
          if (!prod.ativo) return false;
          if (categoriaSelecionada !== 'todas' && String(prod.categoriaId) !== categoriaSelecionada) return false;
          if (termoBusca.trim() && !prod.nome.toLowerCase().includes(termoBusca.toLowerCase())) return false;
          return true;
        });
      }, [produtos, categoriaSelecionada, termoBusca]);

      const totalCarrinho = useMemo(() => {
        return carrinho.reduce((sum, item) => sum + item.subtotal, 0);
      }, [carrinho]);

      const valorTroco = useMemo(() => {
        if (formaPagamento !== 'Dinheiro') return 0;
        const rec = parseFloat(valorRecebidoDinheiro) || 0;
        return Math.max(0, rec - totalCarrinho);
      }, [formaPagamento, valorRecebidoDinheiro, totalCarrinho]);

      const complementosDoItemModal = useMemo(() => {
        if (!itemModal) return [];
        const compIds = itemModal.complementoIds || [];
        return complementos.filter(c => compIds.includes(String(c.id)));
      }, [itemModal, complementos]);

      const precoUnitarioCalculadoModal = useMemo(() => {
        if (!itemModal) return 0;
        let extra = 0;
        opcoesSelecionadasModal.forEach(opcId => {
          complementosDoItemModal.forEach(comp => {
            const opc = comp.opcoes?.find(o => String(o.id) === String(opcId));
            if (opc) extra += Number(opc.preco || 0);
          });
        });
        return Number(itemModal.preco || 0) + extra;
      }, [itemModal, opcoesSelecionadasModal, complementosDoItemModal]);

      // --- MANIPULAÇÃO DO CARRINHO ---
      const handleAbrirItem = (prod) => {
        setItemModal(prod);
        setQtdModal(1);
        setObservacaoModal('');
        setErroObrigatorioModal(null);
        const opcsIniciais = [];
        const comps = complementos.filter(c => (prod.complementoIds || []).includes(String(c.id)));
        comps.forEach(comp => {
          if (comp.obrigatorio && comp.opcoes && comp.opcoes.length > 0) {
            opcsIniciais.push(comp.opcoes[0].id);
          }
        });
        setOpcoesSelecionadasModal(opcsIniciais);
      };

      const handleToggleOpcaoModal = (obrigatorio, grupoId, opcaoId) => {
        setErroObrigatorioModal(null);
        const grupo = complementos.find(g => String(g.id) === String(grupoId));
        if (!grupo) return;

        if (obrigatorio) {
          const idsDoGrupo = grupo.opcoes.map(o => String(o.id));
          const semOutrasDoGrupo = opcoesSelecionadasModal.filter(id => !idsDoGrupo.includes(String(id)));
          setOpcoesSelecionadasModal([...semOutrasDoGrupo, opcaoId]);
        } else {
          if (opcoesSelecionadasModal.includes(opcaoId)) {
            setOpcoesSelecionadasModal(opcoesSelecionadasModal.filter(id => String(id) !== String(opcaoId)));
          } else {
            setOpcoesSelecionadasModal([...opcoesSelecionadasModal, opcaoId]);
          }
        }
      };

      const handleAdicionarAoCarrinho = () => {
        if (!itemModal) return;

        for (const comp of complementosDoItemModal) {
          if (comp.obrigatorio) {
            const temOpcaoDoGrupo = comp.opcoes.some(opc => opcoesSelecionadasModal.map(String).includes(String(opc.id)));
            if (!temOpcaoDoGrupo) {
              setErroObrigatorioModal(`Por favor, selecione uma opção em "${comp.nome}".`);
              return;
            }
          }
        }

        const opcoesDetalhadas = [];
        opcoesSelecionadasModal.forEach(opcId => {
          complementosDoItemModal.forEach(comp => {
            const opc = comp.opcoes?.find(o => String(o.id) === String(opcId));
            if (opc) {
              opcoesDetalhadas.push({ id: opc.id, nome: opc.nome, preco: Number(opc.preco || 0) });
            }
          });
        });

        const novoItemCarrinho = {
          carrinhoItemId: Date.now() + Math.random(),
          produtoId: itemModal.id,
          nome: itemModal.nome,
          precoBase: itemModal.preco,
          precoUnitario: precoUnitarioCalculadoModal,
          quantidade: qtdModal,
          subtotal: precoUnitarioCalculadoModal * qtdModal,
          opcoes: opcoesDetalhadas,
          observacao: observacaoModal.trim()
        };

        setCarrinho(prev => [...prev, novoItemCarrinho]);
        setItemModal(null);
        mostrarToast(`🛒 ${qtdModal}x "${itemModal.nome}" adicionado!`);
      };

      const handleRemoverDoCarrinho = (carrinhoItemId) => {
        setCarrinho(prev => prev.filter(i => i.carrinhoItemId !== carrinhoItemId));
      };

      const handleAlterarQtdCarrinho = (carrinhoItemId, delta) => {
        setCarrinho(prev => prev.map(item => {
          if (item.carrinhoItemId === carrinhoItemId) {
            const novaQtd = Math.max(1, item.quantidade + delta);
            return {
              ...item,
              quantidade: novaQtd,
              subtotal: item.precoUnitario * novaQtd
            };
          }
          return item;
        }));
      };

      // --- IMPRESSÃO TÉRMICA TIPO 2 VIAS ---
      const executarImpressaoDireta = (venda) => {
        if (!venda) return;
        const printArea = document.getElementById('thermal-receipt-print-area');
        if (!printArea) return;

        const largura = configImpressora.larguraPapel === '58mm' ? '58mm' : '80mm';
        printArea.style.width = largura;

        const itensProducaoHTML = (venda.itens || []).map(it => `
          <div style="margin-bottom: 6px; border-bottom: 1px dashed #000; padding-bottom: 6px;">
            <div style="display: flex; justify-content: space-between; font-weight: 900; font-size: 13px;">
              <span>${it.quantidade}x ${it.nome}</span>
            </div>
            ${it.opcoes && it.opcoes.length > 0 ? it.opcoes.map(o => `<div style="font-size: 11px; padding-left: 10px; font-weight: bold;">• ${o.nome}</div>`).join('') : ''}
            ${it.observacao ? `<div style="font-size: 11px; font-weight: 900; background: #000; color: #fff; padding: 2px 6px; border-radius: 4px; margin-top: 4px; display: inline-block;">OBS: ${it.observacao}</div>` : ''}
          </div>
        `).join('');

        const totalItensQtd = (venda.itens || []).reduce((sum, i) => sum + (i.quantidade || 1), 0);

        printArea.innerHTML = `
          <div style="text-align: center; font-size: 12px; line-height: 1.3; color: #000; padding-bottom: 10px;">
            <div style="font-weight: 900; font-size: 13px; text-transform: uppercase; border: 2px solid #000; padding: 3px 0; margin-bottom: 6px;">
              *** 1ª VIA - PRODUÇÃO / COZINHA ***
            </div>
            <div style="font-weight: 900; font-size: 14px; text-transform: uppercase;">${lojaInfo.nome}</div>

            <div style="font-weight: 900; margin-bottom: 4px; text-transform: uppercase; font-size: 13px; text-align: left;">

            </div>
            <div style="margin: 4px 0; font-weight: bold;">================================</div>
            <div style="text-align: left; margin-bottom: 8px;">
              ${itensProducaoHTML}

            <div style="margin: 4px 0; font-weight: bold;">================================</div>
            <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 900;">

              <span>${totalItensQtd} un.</span>
            </div>
          </div>

          <div style="margin: 15px 0 20px 0; text-align: center; font-size: 10px; font-weight: bold; border-top: 2px dashed #000; border-bottom: 2px dashed #000; padding: 6px 0;">

          </div>

          <div style="text-align: center; font-size: 12px; line-height: 1.3; color: #000;">
            <div style="font-weight: 900; font-size: 13px; text-transform: uppercase; border: 2px solid #000; padding: 3px 0; margin-bottom: 6px;">
              *** 2ª VIA - CLIENTE / SENHA ***
            </div>
            <div style="font-weight: 900; font-size: 15px; text-transform: uppercase;">${lojaInfo.nome}</div>
            <div>${lojaInfo.endereco}</div>
            <div>Tel: ${lojaInfo.telefone} ${lojaInfo.cnpj ? ' • ' + lojaInfo.cnpj : ''}</div>
            <div style="margin: 6px 0; font-weight: bold;">--------------------------------</div>
            <div style="font-size: 11px;">Data: ${venda.data} - ${venda.hora}</div>
            
            <div style="margin: 8px 0; padding: 8px; border: 3px solid #000; border-radius: 8px; background: #fff;">
              <div style="font-size: 11px; font-weight: 900; text-transform: uppercase;">SUA SENHA DE ATENDIMENTO</div>
              <div style="font-size: 44px; font-weight: 900; letter-spacing: 2px; line-height: 1; margin: 4px 0;">#${venda.senha}</div>
              <div style="font-size: 10px; font-weight: bold;">Aguarde a chamada da sua senha</div>
            </div>

            <div style="font-weight: 900; margin-bottom: 4px; text-transform: uppercase; text-align: left;">
              CLIENTE: ${venda.cliente || 'Cliente Balcão'}
            </div>
            <div style="margin: 6px 0; font-weight: bold;">--------------------------------</div>
            
            <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 900;">
              <span>TOTAL PAGO:</span>
              <span>R$ ${(venda.total || 0).toFixed(2)}</span>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 11px; margin-top: 4px;">
              <span>FORMA PAGTO:</span>
              <span style="font-weight: bold;">${venda.pagamento}</span>
            </div>
            ${venda.pagamento === 'Dinheiro' ? `
              <div style="display: flex; justify-content: space-between; font-size: 11px;">
                <span>TROCO:</span>
                <span style="font-weight: bold;">R$ ${(venda.troco || 0).toFixed(2)}</span>
              </div>

            <div style="margin: 10px 0 4px 0; font-weight: bold;">--------------------------------</div>
            <div style="font-size: 11px; font-weight: 900; text-transform: uppercase;">Obrigado pela preferência!</div>
          </div>
        `;

        setTimeout(() => {
          window.print();
        }, 100);
      };

      // --- FINALIZAR PEDIDO E SINCRONIZAR NA NUVEM ---
      const handleFinalizarPedido = () => {
        if (carrinho.length === 0) return;

        if (formaPagamento === 'Dinheiro') {
          const recebido = parseFloat(valorRecebidoDinheiro) || 0;
          if (recebido < totalCarrinho) {
            mostrarToast('Valor recebido é menor que o total da venda!', 'alerta');
            return;
          }
        }

        const horaAtual = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        const dataAtual = new Date().toLocaleDateString('pt-BR');
        const senhaFormatada = String(senhaNumero).padStart(2, '0');
        const novoId = String(Date.now());

        const pedidoConcluido = {
          id: novoId,
          timestamp: Date.now(),
          comanda: senhaFormatada,
          senha: senhaFormatada,
          cliente: clienteNome.trim() || 'Cliente Balcão',
          hora: horaAtual,
          data: dataAtual,
          periodo: 'dia',
          pagamento: formaPagamento,
          valorRecebido: formaPagamento === 'Dinheiro' ? (parseFloat(valorRecebidoDinheiro) || totalCarrinho) : totalCarrinho,
          troco: valorTroco,
          itens: [...carrinho],
          total: totalCarrinho,
          status: 'em_preparo'
        };

        window.SyncService.saveDoc('vendas', novoId, pedidoConcluido);

        setComandaConcluidaModal(pedidoConcluido);
        setCarrinho([]);
        setClienteNome('');
        setValorRecebidoDinheiro('');
        
        setSenhaNumero(prev => (prev >= 99 ? 1 : prev + 1));

        if (configImpressora.imprimirAutomatico) {
          executarImpressaoDireta(pedidoConcluido);
        }
      };

      const handleCancelarVenda = (vendaId) => {
        window.SyncService.deleteDoc('vendas', vendaId);
        setComandaConcluidaModal(null);
        mostrarToast('❌ Venda estornada com sucesso!', 'alerta');
      };

      // --- CÁLCULOS DO DASHBOARD ---
      const vendasFiltradasDashboard = useMemo(() => {
        if (periodoFiltro === 'dia') return historicoVendas.filter(v => v.periodo === 'dia');
        return historicoVendas;
      }, [historicoVendas, periodoFiltro]);

      const faturamentoHoje = useMemo(() => {
        return historicoVendas.filter(v => v.periodo === 'dia').reduce((sum, v) => sum + (v.total || 0), 0);
      }, [historicoVendas]);

      const faturamentoTotalDashboard = useMemo(() => {
        return vendasFiltradasDashboard.reduce((sum, v) => sum + (v.total || 0), 0);
      }, [vendasFiltradasDashboard]);

      const totalUnidadesVendidas = useMemo(() => {
        return vendasFiltradasDashboard.reduce((sum, venda) => {
          return sum + (venda.itens || []).reduce((sumItens, item) => sumItens + (item.quantidade || item.qtd || 1), 0);
        }, 0);
      }, [vendasFiltradasDashboard]);

      const relatorioItensVendidos = useMemo(() => {
        const agrupa = {};
        vendasFiltradasDashboard.forEach(venda => {
          (venda.itens || []).forEach(item => {
            const nomeKey = item.nome;
            if (!agrupa[nomeKey]) {
              const prodObj = produtos.find(p => String(p.id) === String(item.produtoId));
              const catObj = prodObj ? categorias.find(c => String(c.id) === String(prodObj.categoriaId)) : null;

              agrupa[nomeKey] = {
                id: item.produtoId,
                nome: item.nome,
                categoriaNome: catObj ? catObj.nome : 'Geral',
                categoriaCor: catObj ? catObj.cor : '#6366f1',
                qtd: 0,
                faturamento: 0
              };
            }
            const q = item.quantidade || item.qtd || 1;
            agrupa[nomeKey].qtd += q;
            agrupa[nomeKey].faturamento += (item.subtotal || 0);
          });
        });
        return Object.values(agrupa).sort((a, b) => b.qtd - a.qtd);
      }, [vendasFiltradasDashboard, produtos, categorias]);

      // --- AÇÕES DO DASHBOARD ---
      const handleAdicionarCategoria = (e) => {
        e.preventDefault();
        if (!novaCatNome.trim()) return;
        const newId = String(Date.now());
        const cat = { id: newId, nome: novaCatNome.trim(), cor: novaCatCor || '#f59e0b' };
        window.SyncService.saveDoc('categorias', newId, cat);
        setNovaCatNome('');
        mostrarToast(`Categoria "${cat.nome}" criada!`);
      };

      const handleSalvarProduto = (e) => {
        e.preventDefault();
        if (!novoProdNome.trim() || !novoProdPreco) return;

        const prodId = editandoProdId ? String(editandoProdId) : String(Date.now());
        const prodData = {
          id: prodId,
          nome: novoProdNome.trim(),
          categoriaId: String(novoProdCatId || categorias[0]?.id || '1'),
          preco: parseFloat(novoProdPreco) || 0,
          complementoIds: novoProdComplementoIds.map(String),
          ativo: true
        };

        window.SyncService.saveDoc('produtos', prodId, prodData);
        setEditandoProdId(null);
        setNovoProdNome('');
        setNovoProdPreco('');
        setNovoProdComplementoIds([]);
        mostrarToast(`Produto "${prodData.nome}" salvo!`);
      };

      const handleAdicionarTipoComplementoTemp = () => {
        if (!tempTipoNome.trim()) return;
        const novo = { id: String(Date.now() + Math.random()), nome: tempTipoNome.trim(), preco: parseFloat(tempTipoPreco) || 0 };
        setTiposComplemento([...tiposComplemento, novo]);
        setTempTipoNome('');
        setTempTipoPreco('');
      };

      const handleSalvarComplemento = (e) => {
        e.preventDefault();
        if (!novoCompNome.trim()) return;

        const compId = editandoCompId ? String(editandoCompId) : String(Date.now());
        const compData = {
          id: compId,
          nome: novoCompNome.trim(),
          obrigatorio: novoCompObrigatorio,
          opcoes: tiposComplemento
        };

        window.SyncService.saveDoc('complementos', compId, compData);
        setEditandoCompId(null);
        setNovoCompNome('');
        setNovoCompObrigatorio(false);
        setTiposComplemento([]);
        mostrarToast(`Complemento "${compData.nome}" salvo na nuvem!`);
      };

      const handleSalvarUsuario = (e) => {
        e.preventDefault();
        if (!novoUserNome.trim()) return;

        const userId = editandoUserId ? String(editandoUserId) : String(Date.now());
        const userData = {
          id: userId,
          nome: novoUserNome.trim(),
          email: novoUserEmail.trim(),
          cargo: novoUserCargo,
          pin: novoUserPin || '0000',
          nivelAcesso: novoUserNivel,
          ativo: true,
          cor: '#6366f1',
          iniciais: novoUserNome.trim().split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase()
        };

        window.SyncService.saveDoc('operadores', userId, userData);
        setEditandoUserId(null);
        setNovoUserNome('');
        setNovoUserEmail('');
        setNovoUserPin('0000');
        mostrarToast(`Usuário "${userData.nome}" atualizado!`);
      };

      const handleExcluirItemDashboard = () => {
        if (!modalConfirmarExcluir) return;
        const { tipo, item } = modalConfirmarExcluir;

        if (tipo === 'categoria') window.SyncService.deleteDoc('categorias', item.id);
        else if (tipo === 'produto') window.SyncService.deleteDoc('produtos', item.id);
        else if (tipo === 'complemento') window.SyncService.deleteDoc('complementos', item.id);
        else if (tipo === 'usuario') window.SyncService.deleteDoc('operadores', item.id);

        mostrarToast(`Item excluído com sucesso.`, 'alerta');
        setModalConfirmarExcluir(null);
      };

      // --- TELA DE LOGIN TELA INTEIRA COM MARCA GTECH AUTOMATIZAÇÃO ---
      if (!usuarioLogado) {
        return (
          <div className="flex items-center justify-center min-h-screen bg-slate-950 text-white p-4 font-sans select-none">
            <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
              
              {/* BRANDING GTECH AUTOMATIZAÇÃO & PAINEL DE LOGIN */}
              <div className="text-center space-y-2">
                <div className="w-14 h-14 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto shadow-lg shadow-indigo-500/30 ring-4 ring-indigo-500/20">
                  <IconStore />

                <div>
                  <div className="inline-block px-3 py-1 bg-indigo-500/10 border border-indigo-500/30 rounded-full text-[11px] font-black text-indigo-400 uppercase tracking-wider mb-1">
                    Gtech - automatização
                  </div>
                  <h1 className="text-base sm:text-lg font-black uppercase tracking-wider text-white">
                    {lojaInfo.nome}
                  </h1>
                  <p className="text-xs text-slate-400">Sistema Integrado de Vendas & Gestão</p>
                </div>
              </div>

              {erroLogin && (
                <div className="p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-bold text-center animate-bounce">
                  ⚠️ {erroLogin}
                </div>
              )}

              <div className="flex bg-slate-950 p-1 rounded-2xl border border-slate-800 text-xs font-bold">
                <button
                  type="button"
                  onClick={() => { setModoLogin('pin'); setErroLogin(''); }}
                  className={`flex-1 py-2 rounded-xl transition ${modoLogin === 'pin' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}
                >
                  🔢 PIN Numérico
                </button>
                <button
                  type="button"
                  onClick={() => { setModoLogin('email'); setErroLogin(''); }}
                  className={`flex-1 py-2 rounded-xl transition ${modoLogin === 'email' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}
                >
                  ✉️ E-mail / Senha
                </button>
              </div>

              {modoLogin === 'pin' ? (
                <div className="space-y-5">
                  {!operadorSelecionado ? (
                    <div className="space-y-3">
                      <span className="block text-xs font-extrabold uppercase tracking-wider text-slate-400 text-center">

                      </span>

                        {operadores.filter(o => o.ativo !== false).map((op) => (
                          <button

                              <div className="text-left">
                                <span className="font-extrabold text-sm text-white block leading-tight">{op.nome}</span>
                                <span className="text-[11px] text-slate-400 font-medium block">{op.cargo}</span>
                              </div>
                            </div>
                            <span className="text-xs font-bold text-indigo-400">Entrar →</span>

                  ) : (

                      <div className="flex justify-center items-center gap-3 py-2">
                        {[0, 1, 2, 3].map((idx) => (
                          <div

                    <span className="text-xs font-bold text-slate-500 uppercase">Qtd:</span>
                    <div className="flex items-center gap-1 bg-slate-100 p-1 rounded-2xl border">
                      <button type="button" onClick={() => setQtdModal(prev => Math.max(1, prev - 1))} className="w-8 h-8 rounded-xl bg-white text-slate-800 font-black text-sm flex items-center justify-center">-</button>
                      <span className="w-8 text-center font-mono font-black text-sm">{qtdModal}</span>
                      <button type="button" onClick={() => setQtdModal(prev => prev + 1)} className="w-8 h-8 rounded-xl bg-white text-slate-800 font-black text-sm flex items-center justify-center">+</button>
                    </div>
                  </div>

                  <button
                    type="button"
                    onClick={handleAdicionarAoCarrinho}
                    className="w-full sm:w-auto flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-black py-3 px-5 rounded-2xl text-xs uppercase tracking-wider shadow-lg transition flex items-center justify-between"
                  >
                    <span>Incluir no Pedido</span>
                    <span className="font-mono bg-indigo-700 px-2.5 py-1 rounded-xl text-xs">
                      R$ {(precoUnitarioCalculadoModal * qtdModal).toFixed(2)}
                    </span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL COMANDA EMITIDA / IMPRESSÃO 2 VIAS */}
          {comandaConcluidaModal && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-xs z-50 flex items-center justify-center p-3 sm:p-4">
              <div className="bg-white rounded-3xl max-w-sm w-full p-5 sm:p-6 shadow-2xl flex flex-col space-y-3 max-h-[92vh] overflow-y-auto custom-scroll">
                
                <div className="text-center space-y-1 shrink-0">
                  <div className="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-1">
                    <IconCheck />
                  </div>
                  <h3 className="text-base font-black text-slate-900">Venda Finalizada!</h3>
                </div>

                <div className="flex bg-slate-100 p-1 rounded-xl text-xs font-bold shrink-0">
                  <button onClick={() => setAbaViaModal('producao')} className={`flex-1 py-1.5 rounded-lg ${abaViaModal === 'producao' ? 'bg-slate-900 text-white' : 'text-slate-600'}`}>👨‍🍳 1ª Via (Produção)</button>
                  <button onClick={() => setAbaViaModal('cliente')} className={`flex-1 py-1.5 rounded-lg ${abaViaModal === 'cliente' ? 'bg-slate-900 text-white' : 'text-slate-600'}`}>🎫 2ª Via (Cliente)</button>
                </div>

                {abaViaModal === 'producao' ? (
                  <div className="bg-amber-50 border-2 border-dashed border-amber-300 p-3.5 rounded-2xl font-mono text-xs space-y-2 text-slate-900 shrink-0">
                    <div className="text-center border-b border-dashed border-amber-300 pb-2">
                      <span className="bg-slate-900 text-amber-300 text-[10px] font-black px-2 py-0.5 rounded uppercase block mb-1">*** 1ª VIA: PRODUÇÃO / COZINHA ***</span>
                      <p className="font-extrabold text-xs uppercase">{lojaInfo.nome}</p>
                      <p className="text-[10px] text-slate-500">{comandaConcluidaModal.data} - {comandaConcluidaModal.hora}</p>
                      <div className="my-2 p-2 bg-amber-400 text-slate-950 rounded-xl">
                        <p className="text-[10px] font-black uppercase">SENHA DE ATENDIMENTO</p>
                        <p className="font-black text-3xl tracking-widest leading-tight">#{comandaConcluidaModal.senha}</p>
                      </div>
                      <p className="text-[11px] font-extrabold text-slate-900 truncate">Cliente: {comandaConcluidaModal.cliente}</p>
                    </div>

                    <div className="space-y-2 py-1 max-h-36 overflow-y-auto custom-scroll">
                      {comandaConcluidaModal.itens.map((it, idx) => (
                        <div key={idx} className="border-b border-amber-200/60 pb-1.5">
                          <div className="font-black text-xs text-slate-900">{it.quantidade}x {it.nome}</div>
                          {it.opcoes && it.opcoes.map((o, oi) => <span key={oi} className="block text-[10px] font-bold text-slate-700 pl-2">• {o.nome}</span>)}
                          {it.observacao && <div className="text-[10px] font-black bg-slate-900 text-white p-1 rounded mt-1">OBS: {it.observacao}</div>}
                        </div>
                      ))}
                    </div>
                  </div>
                ) : (
                  <div className="bg-emerald-50 border-2 border-dashed border-emerald-300 p-3.5 rounded-2xl font-mono text-xs space-y-2 text-slate-900 shrink-0">
                    <div className="text-center border-b border-dashed border-emerald-300 pb-2">
                      <span className="bg-emerald-700 text-white text-[10px] font-black px-2 py-0.5 rounded uppercase block mb-1">*** 2ª VIA: CLIENTE / SENHA ***</span>
                      <p className="font-extrabold text-xs uppercase">{lojaInfo.nome}</p>
                      <div className="my-2 p-2.5 bg-emerald-500 text-slate-950 rounded-xl">
                        <p className="text-[10px] font-black uppercase">SUA SENHA DE ATENDIMENTO</p>
                        <p className="font-black text-4xl tracking-widest leading-tight">#{comandaConcluidaModal.senha}</p>
                      </div>
                      <p className="text-[11px] font-extrabold text-slate-900 truncate">Cliente: {comandaConcluidaModal.cliente}</p>
                    </div>

                    <div className="space-y-1 text-slate-700">
                      <div className="flex justify-between font-black text-sm text-slate-900"><span>TOTAL PAGO:</span><span>R$ {(comandaConcluidaModal.total || 0).toFixed(2)}</span></div>
                      <div className="flex justify-between text-[11px]"><span>Forma Pagto:</span><span className="font-bold">{comandaConcluidaModal.pagamento}</span></div>
                    </div>
                  </div>
                )}

                <div className="flex flex-col gap-2 pt-1 shrink-0">
                  <div className="flex gap-2">
                    <button onClick={() => executarImpressaoDireta(comandaConcluidaModal)} className="flex-1 bg-slate-900 text-white font-black py-2.5 rounded-2xl text-xs flex items-center justify-center gap-1.5"><IconPrinter /><span>Imprimir 2 Vias</span></button>
                    <button onClick={() => setComandaConcluidaModal(null)} className="flex-1 bg-emerald-600 text-white font-black py-2.5 rounded-2xl text-xs">Nova Venda</button>
                  </div>
                  <button onClick={() => handleCancelarVenda(comandaConcluidaModal.id)} className="w-full bg-red-50 text-red-600 border border-red-200 font-bold py-2 rounded-2xl text-xs flex items-center justify-center gap-1.5"><IconTrash /><span>Cancelar Venda</span></button>
                </div>

              </div>
            </div>
          )}

          {/* MODAL CONFIRMAR EXCLUSÃO DASHBOARD */}
          {modalConfirmarExcluir && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4">
                <h3 className="text-base font-bold text-slate-900">Confirmar Exclusão?</h3>
                <p className="text-xs text-slate-500">Deseja remover <strong>"{modalConfirmarExcluir.item.nome}"</strong> da nuvem?</p>
                <div className="flex gap-2">
                  <button onClick={() => setModalConfirmarExcluir(null)} className="flex-1 bg-slate-100 text-slate-700 font-bold py-2 rounded-xl text-xs">Cancelar</button>
                  <button onClick={handleExcluirItemDashboard} className="flex-1 bg-red-600 text-white font-bold py-2 rounded-xl text-xs">Excluir</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
